name: Sync Google Drive

# Started only on request: by the Sync button, by the daily Netlify scheduled
# function (netlify/functions/scheduled-sync.js, 06:00 UTC), or from the
# GitHub UI. There is deliberately no `schedule:` trigger here, because GitHub
# switches off scheduled workflows in public repos after 60 days without a
# commit, which silently stopped the daily sync between July and October 2026.
on:
  workflow_dispatch:

# Only ever run one sync at a time. If a sync is already running when another
# is triggered (daily or manual), the new one waits in the queue rather than
# starting a competing run that would fight over data.json.
concurrency:
  group: sync-drive
  cancel-in-progress: false

# The job writes to R2 with its own keys and never writes to this repo, so
# the workflow's GitHub token only needs to read it.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          SHARED_DRIVE_ID: ${{ secrets.SHARED_DRIVE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_JURISDICTION: ${{ secrets.R2_JURISDICTION }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python scripts/sync.py
